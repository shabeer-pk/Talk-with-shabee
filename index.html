<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Talk with Shebi</title>
<style>
  :root { --ink:#07151f; --glass:rgba(255,255,255,.10); --glass2:rgba(255,255,255,.18); --line:rgba(255,255,255,.2);
          --txt:#f2f7fa; --mut:#a9bcc6; --ok:#2fd49a; --bad:#ff5d6c; --sun:#ffc48a; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body { background:var(--ink); color:var(--txt); font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
         display:flex; align-items:center; justify-content:center; padding:20px; overflow:hidden; }
  .hide { display:none !important; }
  svg { display:block; }

  /* ambient aurora behind the glass */
  .bg { position:fixed; inset:0; z-index:0; overflow:hidden; }
  .bg i { position:absolute; border-radius:50%; filter:blur(70px); opacity:.75; animation:drift 26s ease-in-out infinite alternate; }
  .bg i:nth-child(1) { width:62vmax; height:62vmax; left:-22vmax; top:-18vmax; background:#17888a; }
  .bg i:nth-child(2) { width:58vmax; height:58vmax; right:-20vmax; bottom:-22vmax; background:#4b36c9; animation-duration:32s; }
  .bg i:nth-child(3) { width:34vmax; height:34vmax; left:30%; top:42%; background:#ffb27a; opacity:.28; animation-duration:38s; }
  @keyframes drift { to { transform:translate(7vmax,5vmax) scale(1.12); } }

  .card { position:relative; z-index:1; width:min(100%,400px); max-height:100%; overflow:auto; padding:34px 24px 24px; border-radius:34px; text-align:center;
          background:linear-gradient(160deg,rgba(255,255,255,.17),rgba(255,255,255,.05));
          border:1px solid var(--line); box-shadow:0 30px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.38);
          -webkit-backdrop-filter:blur(28px) saturate(150%); backdrop-filter:blur(28px) saturate(150%); }
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))) { .card { background:rgba(14,36,48,.92); } }

  /* glass bubble avatar */
  .avatar { width:104px; height:104px; border-radius:50%; margin:0 auto 18px; display:grid; place-items:center; font-size:44px; font-weight:700;
            background:radial-gradient(circle at 30% 22%, rgba(255,255,255,.6), rgba(255,255,255,0) 42%), linear-gradient(145deg,#3fb8b0,#4a3bc2);
            border:1px solid rgba(255,255,255,.45);
            box-shadow:inset 0 -12px 26px rgba(0,0,0,.28), inset 0 6px 14px rgba(255,255,255,.32), 0 18px 40px rgba(20,60,120,.45); }
  .avatar.ring { animation:ripple 1.5s infinite; }
  @keyframes ripple { 0% { box-shadow:inset 0 -12px 26px rgba(0,0,0,.28), 0 0 0 0 rgba(120,230,220,.55); } 100% { box-shadow:inset 0 -12px 26px rgba(0,0,0,.28), 0 0 0 30px rgba(120,230,220,0); } }

  h1 { font-size:26px; font-weight:700; letter-spacing:-.01em; margin-bottom:6px; }
  .sub { color:var(--mut); font-size:14.5px; line-height:1.45; min-height:22px; margin-bottom:22px; }
  .note { color:var(--mut); font-size:12.5px; line-height:1.5; margin-top:14px; }
  .note b { color:#9fe8e0; font-weight:600; user-select:all; word-break:break-all; }

  /* buttons */
  .btn { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; margin-top:10px; padding:15px 18px; border-radius:18px;
         border:1px solid var(--line); font-weight:600; font-size:16px; line-height:1.2; font-family:inherit; color:#fff; cursor:pointer;
         background:var(--glass); box-shadow:inset 0 1px 0 rgba(255,255,255,.3);
         -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); transition:transform .12s ease, filter .2s ease; }
  .btn svg { width:20px; height:20px; flex:none; }
  .btn:active { transform:scale(.97); }
  .btn:hover { filter:brightness(1.08); }
  .btn:focus-visible, .cb:focus-visible, .ibtn:focus-visible, select:focus-visible, .txt:focus-visible { outline:2px solid var(--sun); outline-offset:2px; }
  .btn:disabled { opacity:.55; }
  .btn.primary { background:linear-gradient(135deg,#2cc4b0,#5b4be0); border-color:rgba(255,255,255,.38); box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 10px 26px rgba(70,80,220,.4); }
  .btn.call    { background:linear-gradient(135deg,#43e3ab,#17a572); border-color:rgba(255,255,255,.4); box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 10px 26px rgba(23,165,114,.4); }
  .btn.end     { background:linear-gradient(135deg,#ff7d88,#df3449); border-color:rgba(255,255,255,.38); box-shadow:inset 0 1px 0 rgba(255,255,255,.45), 0 10px 26px rgba(223,52,73,.35); }
  .btn.wa      { background:linear-gradient(135deg,#3fe083,#1fa855); border-color:rgba(255,255,255,.38); }
  .btn.tint    { background:rgba(255,196,138,.18); border-color:rgba(255,196,138,.5); color:#ffe3c6; }
  .btn.ghost   { background:transparent; border-color:transparent; box-shadow:none; color:var(--mut); font-weight:500; font-size:14.5px; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .row2 .btn { padding:14px 10px; font-size:15px; }
  .row2.sp .btn { margin-top:10px; }

  /* fields */
  .fld { display:block; text-align:left; margin-bottom:10px; }
  .fld > span { display:block; font-size:13px; color:var(--mut); margin:0 4px 6px; }
  select, .txt { width:100%; padding:14px 16px; border-radius:16px; border:1px solid var(--line); background:rgba(0,0,0,.24); color:var(--txt); font-size:16px; font-family:inherit; }
  select option { color:#111; }
  textarea.txt { resize:none; min-height:84px; margin-bottom:2px; }
  input.txt { margin-bottom:10px; }
  .linkbox { text-align:left; background:rgba(0,0,0,.28); border:1px solid var(--line); border-radius:16px; padding:13px 14px; margin:2px 0 6px;
             font-size:12.5px; word-break:break-all; color:#9fe8e0; user-select:all; }

  /* audio level bars */
  #meters { margin-bottom:14px; }
  .m { display:flex; align-items:center; gap:10px; font-size:13px; color:var(--mut); margin:6px 0; text-align:left; }
  .m span { width:64px; flex:none; }
  .bar { flex:1; height:6px; background:rgba(255,255,255,.14); border-radius:6px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--ok); transition:width .1s; }

  /* ===== 1-to-1 call screen ===== */
  #stage, #gstage { position:fixed; inset:0; background:radial-gradient(circle at 50% 18%, #153a4d 0%, #06121a 72%); overflow:hidden; }
  #stage { z-index:50; } #gstage { z-index:55; }
  #stage video { background:#000; }
  #rvid { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:none; }
  #stage.hasRemote #rvid { display:block; }
  #noVid { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; }
  #noVid .avatar { margin:0 0 10px; }
  #stName { font-size:22px; font-weight:600; padding:0 24px; text-align:center; }
  #stage.hasRemote #noVid { display:none; }
  #lvid { position:absolute; right:14px; top:max(64px, calc(env(safe-area-inset-top) + 56px)); width:28vw; max-width:150px; aspect-ratio:3/4; object-fit:cover; display:none;
          border-radius:18px; border:1.5px solid rgba(255,255,255,.4); box-shadow:0 8px 24px rgba(0,0,0,.5); }
  #stage.hasLocal #lvid { display:block; }
  #topbar { position:absolute; top:max(14px, env(safe-area-inset-top)); left:0; right:0; text-align:center; text-shadow:0 1px 6px rgba(0,0,0,.7); }
  .timer { font-size:22px; font-weight:600; font-variant-numeric:tabular-nums; }
  #topbar .mini { display:flex; justify-content:center; gap:8px; margin-top:6px; }
  #topbar .mini .bar { flex:none; width:56px; height:5px; }
  #ctrls, #gCtrls { position:absolute; bottom:max(26px, env(safe-area-inset-bottom)); left:0; right:0; display:flex; justify-content:center; gap:8px; z-index:2; padding:0 8px; }

  /* glass bubble control buttons */
  .cb { position:relative; width:54px; height:54px; flex:none; border-radius:50%; display:grid; place-items:center; color:#fff; cursor:pointer; margin:0; padding:0;
        background:radial-gradient(circle at 30% 20%, rgba(255,255,255,.38), rgba(255,255,255,.08) 55%), rgba(255,255,255,.1);
        border:1px solid rgba(255,255,255,.32); box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 8px 22px rgba(0,0,0,.38);
        -webkit-backdrop-filter:blur(16px) saturate(150%); backdrop-filter:blur(16px) saturate(150%); transition:transform .12s ease, background .2s ease; }
  .cb svg { width:23px; height:23px; }
  .cb:active { transform:scale(.92); }
  .cb.off { background:#fff; color:#0b2a38; }
  .cb.end { background:radial-gradient(circle at 30% 20%, rgba(255,255,255,.45), rgba(255,255,255,0) 50%), linear-gradient(135deg,#ff7d88,#df3449); border-color:rgba(255,255,255,.4); }
  .badge { position:absolute; top:-3px; right:-3px; min-width:19px; height:19px; padding:0 5px; border-radius:10px; background:#ff5d6c; color:#fff; font:700 11px/19px system-ui; text-align:center; border:2px solid #0b2a38; }

  /* ===== group call screen ===== */
  #gTop { position:absolute; top:max(12px, env(safe-area-inset-top)); left:0; right:0; display:flex; justify-content:center; gap:14px; font-size:15px; font-weight:600; text-shadow:0 1px 6px rgba(0,0,0,.7); z-index:2; font-variant-numeric:tabular-nums; }
  #gGrid { position:absolute; top:max(48px, calc(env(safe-area-inset-top) + 40px)); bottom:104px; left:8px; right:8px; display:grid; gap:8px; grid-template-columns:1fr; grid-auto-rows:1fr; }
  #gGrid[data-n="3"], #gGrid[data-n="4"] { grid-template-columns:1fr 1fr; }
  @media (orientation:landscape) { #gGrid[data-n="2"] { grid-template-columns:1fr 1fr; } }
  .tile { position:relative; min-height:0; border-radius:22px; overflow:hidden; display:flex; align-items:center; justify-content:center;
          background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04)); border:1px solid var(--line); transition:box-shadow .15s; }
  .tile video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:none; background:#000; }
  .tile.hasVid video { display:block; }
  .tile .av { width:72px; height:72px; border-radius:50%; display:grid; place-items:center; font-size:30px; font-weight:700;
              background:radial-gradient(circle at 30% 22%, rgba(255,255,255,.55), rgba(255,255,255,0) 42%), linear-gradient(145deg,#3fb8b0,#4a3bc2);
              border:1px solid rgba(255,255,255,.4); box-shadow:inset 0 -8px 16px rgba(0,0,0,.25); }
  .tile.hasVid .av { display:none; }
  .tile .nm { position:absolute; left:10px; bottom:8px; font-size:13px; padding:3px 10px; border-radius:12px; background:rgba(0,0,0,.45); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); }
  .tile.speaking { box-shadow:inset 0 0 0 3px var(--ok); }
  #gSound, #btnSound { margin-top:10px; }
  #gSound { position:absolute; left:20px; right:20px; bottom:110px; width:auto; z-index:3; }

  /* ===== chat + reactions ===== */
  #chat { position:fixed; left:0; right:0; bottom:0; margin:0 auto; max-width:520px; height:64vh; z-index:80; display:flex; flex-direction:column;
          border-radius:28px 28px 0 0; background:linear-gradient(180deg,rgba(28,52,70,.86),rgba(8,20,30,.94)); border:1px solid var(--line); border-bottom:0;
          box-shadow:0 -20px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.3); -webkit-backdrop-filter:blur(30px) saturate(150%); backdrop-filter:blur(30px) saturate(150%);
          animation:sheet .22s ease-out; }
  @keyframes sheet { from { transform:translateY(40px); opacity:0; } }
  #chat header { display:flex; align-items:center; justify-content:space-between; padding:14px 16px 6px 20px; }
  #chat h2 { font-size:17px; font-weight:700; }
  #chatList { flex:1; overflow:auto; padding:8px 14px; display:flex; flex-direction:column; gap:8px; }
  .empty { margin:auto; color:var(--mut); font-size:14px; text-align:center; padding:0 30px; }
  .msg { max-width:80%; padding:9px 13px; border-radius:18px 18px 18px 6px; font-size:15px; line-height:1.4; word-break:break-word; align-self:flex-start; background:var(--glass2); border:1px solid var(--line); }
  .msg.me { align-self:flex-end; border-radius:18px 18px 6px 18px; background:linear-gradient(135deg,#2cc4b0,#5b4be0); border-color:rgba(255,255,255,.3); }
  .msg small { display:block; font-size:11.5px; color:#bfeee9; margin-bottom:2px; }
  #emojiGrid { display:grid; grid-template-columns:repeat(8,1fr); gap:2px; padding:4px 12px 0; }
  #emojiGrid button { background:none; border:0; font-size:23px; padding:5px 0; cursor:pointer; border-radius:10px; }
  #emojiGrid button:active { background:var(--glass2); }
  #chatForm { display:flex; gap:8px; align-items:center; padding:10px 12px calc(12px + env(safe-area-inset-bottom)); }
  #chatInput { flex:1; margin:0; padding:12px 16px; border-radius:24px; }
  .ibtn { width:44px; height:44px; flex:none; border-radius:50%; display:grid; place-items:center; color:#fff; cursor:pointer; border:1px solid var(--line); background:var(--glass2); }
  .ibtn svg { width:20px; height:20px; }
  .ibtn.send { background:linear-gradient(135deg,#2cc4b0,#5b4be0); border-color:rgba(255,255,255,.35); }
  #reactBar { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(max(26px, env(safe-area-inset-bottom)) + 70px); z-index:70; display:flex; gap:2px; padding:6px 10px; border-radius:32px;
              background:rgba(255,255,255,.14); border:1px solid var(--line); box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 12px 30px rgba(0,0,0,.4);
              -webkit-backdrop-filter:blur(20px) saturate(150%); backdrop-filter:blur(20px) saturate(150%); animation:sheet .18s ease-out; }
  #reactBar button { background:none; border:0; font-size:27px; padding:4px 6px; cursor:pointer; border-radius:14px; }
  #reactBar button:active { background:var(--glass2); }
  #floats { position:fixed; inset:0; pointer-events:none; z-index:65; overflow:hidden; }
  .fl { position:absolute; bottom:130px; font-size:42px; text-align:center; animation:rise 2.6s ease-out forwards; }
  .fl small { display:block; font-size:12px; color:#fff; text-shadow:0 1px 4px #000; }
  @keyframes rise { 0% { transform:translateY(0) scale(.6); opacity:0; } 10% { opacity:1; transform:translateY(-20px) scale(1); } 100% { transform:translateY(-55vh) scale(1.15); opacity:0; } }
  @media (prefers-reduced-motion:reduce) {
    .bg i, .avatar.ring, #chat, #reactBar { animation:none; }
    .fl { animation:fadeout 2s forwards; } @keyframes fadeout { 0%,70% { opacity:1; } 100% { opacity:0; } }
  }
  @media (max-width:360px) { .cb { width:50px; height:50px; } #ctrls, #gCtrls { gap:6px; } }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>

<main class="card" id="card">
  <div id="av" class="avatar"><span>S</span></div>
  <h1 id="title">Talk with Shebi</h1>
  <p id="sub" class="sub"></p>

  <div id="meters" class="hide">
    <div class="m"><span>You</span><div class="bar"><i id="mLocal"></i></div></div>
    <div class="m"><span>Them</span><div class="bar"><i id="mRemote"></i></div></div>
    <div class="note" id="conn" style="margin-top:6px"></div>
    <button class="btn tint hide" id="btnSound" data-i="volume">Tap to enable sound</button>
  </div>

  <!-- HOST: create link -->
  <div id="vCreate" class="hide">
    <label class="fld"><span>Call type</span>
      <select id="selType">
        <option value="one">1-to-1 call</option>
        <option value="group">Group call (up to 4 people)</option>
      </select>
    </label>
    <label class="fld"><span>Link validity</span>
      <select id="selMode">
        <option value="reuse">Until I disable it</option>
        <option value="once">One call only</option>
        <option value="1h">1 hour</option>
        <option value="24h">24 hours</option>
        <option value="7d">7 days</option>
      </select>
    </label>
    <button class="btn primary" id="btnCreate" data-i="link">Create call link</button>
  </div>

  <!-- HOST: link ready -->
  <div id="vShare" class="hide">
    <button class="btn tint hide" id="btnAlerts" data-i="bell">Turn on ring sound and alerts</button>
    <div class="linkbox" id="linkBox"></div>
    <div class="note" id="modeNote" style="margin-top:4px"></div>
    <div class="row2">
      <button class="btn" id="btnCopy" data-i="copy">Copy link</button>
      <button class="btn wa" id="btnWA" data-i="share">WhatsApp</button>
    </div>
    <button class="btn end" id="btnDisable" data-i="ban">Disable link</button>
    <div class="note">To get alerts while this page is closed, install the ntfy app and subscribe to<br><b id="topicBox"></b></div>
  </div>

  <!-- GUEST -->
  <div id="vGuest" class="hide">
    <input class="txt hide" id="gName" placeholder="Your name" maxlength="20" autocomplete="name">
    <button class="btn call" id="btnCall" data-i="phone">Call Shebi</button>
    <button class="btn end hide" id="btnCancel" data-i="hangup">Cancel call</button>
    <button class="btn ghost hide" id="btnMsgToggle" data-i="chat">Leave a message instead</button>
    <div id="msgBox" class="hide">
      <input class="txt" id="msgName" placeholder="Your name" maxlength="30" autocomplete="name">
      <textarea class="txt" id="msgText" rows="3" maxlength="500" placeholder="Write your message"></textarea>
      <button class="btn primary" id="btnMsgSend" data-i="send">Send message</button>
      <div class="note" id="msgStatus" role="status"></div>
    </div>
  </div>

  <!-- HOST: incoming -->
  <div id="vIncoming" class="hide">
    <div class="row2 sp">
      <button class="btn end" id="btnDecline" data-i="hangup">Decline</button>
      <button class="btn call" id="btnAnswer" data-i="phone">Answer</button>
    </div>
  </div>
</main>

<audio id="remote" autoplay playsinline></audio>
<audio id="ringAudio" loop playsinline></audio>

<div id="gstage" class="hide">
  <div id="gTop"><span id="gTimer">00:00</span><span id="gCount"></span></div>
  <div id="gGrid" data-n="0"></div>
  <button class="btn tint hide" id="gSound" data-i="volume">Tap to enable sound</button>
  <div id="gCtrls">
    <button class="cb" id="gMute" aria-label="Mute microphone" data-i="mic"></button>
    <button class="cb" id="gCam" aria-label="Camera" data-i="videooff"></button>
    <button class="cb hide" id="gFlip" aria-label="Switch camera" data-i="flip"></button>
    <button class="cb" id="gReact" aria-label="Reactions" data-i="smile"></button>
    <button class="cb" id="gChat" aria-label="Chat" data-i="chat"></button>
    <button class="cb end" id="gEnd" aria-label="Leave call" data-i="hangup"></button>
  </div>
  <div id="gAudio"></div>
</div>

<div id="stage" class="hide">
  <video id="rvid" autoplay playsinline muted></video>
  <div id="noVid"><div class="avatar"><span>S</span></div><div id="stName"></div></div>
  <video id="lvid" autoplay playsinline muted></video>
  <div id="topbar">
    <div class="timer" id="timer">00:00</div>
    <div class="mini"><div class="bar"><i id="mLocal2"></i></div><div class="bar"><i id="mRemote2"></i></div></div>
  </div>
  <div id="ctrls">
    <button class="cb" id="btnMute" aria-label="Mute microphone" data-i="mic"></button>
    <button class="cb" id="btnCam" aria-label="Camera" data-i="videooff"></button>
    <button class="cb hide" id="btnFlip" aria-label="Switch camera" data-i="flip"></button>
    <button class="cb" id="btnReact" aria-label="Reactions" data-i="smile"></button>
    <button class="cb" id="btnChat" aria-label="Chat" data-i="chat"></button>
    <button class="cb end" id="btnEnd" aria-label="End call" data-i="hangup"></button>
  </div>
</div>

<!-- chat sheet, reactions -->
<div id="floats" aria-hidden="true"></div>
<div id="reactBar" class="hide"></div>
<section id="chat" class="hide" aria-label="Chat">
  <header><h2>Chat</h2><button class="ibtn" id="chatClose" aria-label="Close chat" data-i="x"></button></header>
  <div id="chatList"></div>
  <div id="emojiGrid" class="hide"></div>
  <form id="chatForm" autocomplete="off">
    <button type="button" class="ibtn" id="chatEmoji" aria-label="Emoji" data-i="smile"></button>
    <input class="txt" id="chatInput" placeholder="Message" maxlength="500" autocomplete="off">
    <button type="submit" class="ibtn send" id="chatSend" aria-label="Send" data-i="send"></button>
  </form>
</section>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* ================= CONFIG ================= */
const HOST_NAME = "Shebi";
const ADMIN_PIN = "";            // set e.g. "4821" to require a PIN before creating links ("" = off)
// Paste your own Metered TURN credentials URL here (free account). Example:
// "https://YOURAPPNAME.metered.live/api/v1/turn/credentials?apiKey=YOUR_API_KEY"
const METERED_URL = "";
let ICE_SERVERS = [
  { urls: "stun:stun.l.google.com:19302" },
  { urls: "stun:stun1.l.google.com:19302" },
  // Free public TURN fallback (shared, may be slow). Replace with your own Cloudflare/Metered TURN for best reliability.
  { urls: "turn:openrelay.metered.ca:80",  username: "openrelayproject", credential: "openrelayproject" },
  { urls: "turn:openrelay.metered.ca:443", username: "openrelayproject", credential: "openrelayproject" },
  { urls: "turns:openrelay.metered.ca:443?transport=tcp", username: "openrelayproject", credential: "openrelayproject" }
];
const RING_TIMEOUT_MS = 90000;
async function loadIce(){
  if(!METERED_URL) return;

// Raise Opus quality (mono, ~64 kbps, FEC) for clear voice
function sdpTransform(sdp){
  return sdp.replace(/a=fmtp:(\d+) (.*useinbandfec=1.*)/g, (m, pt, rest) =>
    /maxaveragebitrate/.test(rest) ? m : `a=fmtp:${pt} ${rest};maxaveragebitrate=64000;stereo=0;sprop-stereo=0;usedtx=0`);
}

// Prefer H.264 for video: most phones encode/decode it in dedicated hardware, which runs much cooler than software VP8/VP9
function preferH264(sdp){
  try{
    const lines = sdp.split("\r\n");
    const mi = lines.findIndex(l => l.startsWith("m=video")); if(mi < 0) return sdp;
    const all = [];
    lines.forEach(l => { const m = l.match(/^a=rtpmap:(\d+) H264\/90000/); if(m) all.push(m[1]); });
    if(!all.length) return sdp;
    const good = all.filter(pt => lines.some(l => l.startsWith("a=fmtp:" + pt + " ") && /packetization-mode=1/.test(l)));
    const prefer = good.length ? good : all;
    const parts = lines[mi].split(" "), head = parts.slice(0,3), pts = parts.slice(3);
    const ordered = prefer.filter(x => pts.includes(x)).concat(pts.filter(x => !prefer.includes(x)));
    lines[mi] = head.concat(ordered).join(" ");
    return lines.join("\r\n");
  }catch(e){ return sdp; }
}

/* ---------- ringtone (generated WAV played through an <audio> element) ---------- */
function makeRingUrl(){
  const sr = 16000, n = sr * 2, buf = new ArrayBuffer(44 + n*2), v = new DataView(buf);
  const w = (o, str) => { for(let i=0;i<str.length;i++) v.setUint8(o+i, str.charCodeAt(i)); };
  w(0,"RIFF"); v.setUint32(4,36+n*2,true); w(8,"WAVE"); w(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true);
  v.setUint16(22,1,true); v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  w(36,"data"); v.setUint32(40,n*2,true);
  const bursts = [[0,0.4],[0.55,0.95]];
  for(let i=0;i<n;i++){
    const t = i/sr; let env = 0;
    for(const [a0,a1] of bursts){ if(t>=a0 && t<a1) env = Math.min(1,(t-a0)/0.02,(a1-t)/0.02); }
    const smp = env * 0.5 * (Math.sin(2*Math.PI*440*t) + Math.sin(2*Math.PI*480*t)) / 2;
    v.setInt16(44+i*2, Math.round(smp*32767), true);
  }
  return URL.createObjectURL(new Blob([buf], { type:"audio/wav" }));
}

function gStopCam(){
  if(G.cam){ G.cam.getTracks().forEach(t => t.stop()); G.cam = null; }
  G.peers.forEach(e => { if(e.vout){ try{ e.vout.close(); }catch(x){} e.vout = null; } });
  if(G.selfTile){ G.selfTile.classList.remove("hasVid"); G.selfTile.querySelector("video").srcObject = null; }
  setIc($("gCam"), "videooff"); $("gCam").classList.remove("off"); $("gFlip").classList.add("hide");
}
function gEnd(){
  G.live = false;
  clearInterval(G.timerInt); G.timers.forEach(clearInterval); G.timers = [];
  Array.from(G.peers.keys()).forEach(gRemove);
  gStopCam();
  if(G.local){ G.local.getTracks().forEach(t => t.stop()); G.local = null; }
  G.members.forEach(m => { try{ m.dc.close(); }catch(x){} }); G.members = [];
  if(G.hostDc){ try{ G.hostDc.close(); }catch(x){} G.hostDc = null; }
  $("gGrid").innerHTML = ""; gLayout(); $("gstage").classList.add("hide"); clearChat();
  if(wakeLock){ try{ wakeLock.release(); }catch(x){} wakeLock = null; }
  clearMeters();
}
$("gMute").onclick = () => {
  if(!G.local) return;
  const t = G.local.getAudioTracks()[0]; t.enabled = !t.enabled;
  setIc($("gMute"), t.enabled ? "mic" : "micoff"); $("gMute").classList.toggle("off", !t.enabled);
};
$("gCam").onclick = () => { G.cam ? gStopCam() : gStartCam(); };
$("gFlip").onclick = async () => { G.facing = G.facing === "user" ? "environment" : "user"; gStopCam(); await gStartCam(); };
$("gEnd").onclick = () => { if(G.isHost) hostGroupEnd("Group call ended"); else gGuestEnd("You left the call."); };

/* ---- host side of the group ---- */
function hostRingDone(){ incomingActive = false; stopRingtone(); ring(false); clearCallNotification(); }
function hostAdmit(m){
  const before = [{ id: peer.id, name: HOST_NAME }].concat(G.members.filter(x => x.live).map(x => ({ id:x.id, name:x.name })));
  m.live = true;
  try{ m.dc.send({ t:"go", peers:before }); }catch(e){}
  G.members.filter(x => x.live && x !== m).forEach(x => { try{ x.dc.send({ t:"joined", id:m.id, name:m.name }); }catch(e){} });
}
function hostGroupJoin(dc, name){
  const send = o => { try{ dc.send(o); }catch(e){} };
  if(localStorage.getItem("tws_type") !== "group"){ send({ t:"nogroup" }); return; }
  const exp = +localStorage.getItem("tws_exp") || 0;
  if(exp && Date.now() > exp){ send({ t:"declined" }); return; }
  if(G.members.some(m => m.dc === dc)) return;
  if(G.members.length >= GMAX - 1){ send({ t:"full" }); setTimeout(() => { try{ dc.close(); }catch(e){} }, 500); return; }
  const m = { id: dc.peer, name, dc, live:false };
  G.members.push(m);
  if(G.live){ hostAdmit(m); return; }
  send({ t:"wait" });
  if(!incomingActive) hostGroupRing();
}
function hostGroupRing(){
  incomingActive = true;
  setSub("Group call…"); ring(true); startRingtone(); showCallNotification(); show("vIncoming");
  $("btnAnswer").onclick = async () => {
    stopRingtone(); clearCallNotification();
    G.local = await getMic();
    if(!G.local){
      G.members.forEach(m => { try{ m.dc.send({ t:"declined" }); }catch(e){} });
      G.members = []; hostRingDone(); show("vShare"); return;
    }
    incomingActive = false; G.isHost = true; G.myName = HOST_NAME;
    gStart();
    G.members.slice().forEach(hostAdmit);
  };
  $("btnDecline").onclick = () => {
    G.members.forEach(m => { try{ m.dc.send({ t:"declined" }); m.dc.close(); }catch(e){} });
    G.members = []; hostRingDone(); setSub("Waiting for a call…"); show("vShare");
  };
}
function hostGroupLeft(dc){
  const i = G.members.findIndex(m => m.dc === dc); if(i < 0) return;
  const m = G.members.splice(i, 1)[0];
  if(G.live){ gRemove(m.id); }
  else if(incomingActive && G.members.length === 0){ hostRingDone(); setSub("Missed call"); show("vShare"); }
}
function hostGroupEnd(msg){
  gEnd(); G.isHost = false;
  afterHostCall(msg);
}

/* ---- guest side of the group ---- */
function gGuestMsg(msg){
  if(!msg) return;
  if(msg.t === "wait"){ setSub("Waiting for " + HOST_NAME + " to answer…"); }
  else if(msg.t === "go"){
    if(G.live) return;
    clearTimeout(ringTimeout); clearTimeout(gRetry); clearTimeout(gAgain); ring(false);
    gStart();
    (msg.peers || []).forEach(p => gCallPeer(p.id, p.name));
  }
  else if(msg.t === "full"){ gGuestEnd("This call is full (maximum " + GMAX + " people)."); }
  else if(msg.t === "declined"){ gGuestEnd(HOST_NAME + " is not available right now."); }
  else if(msg.t === "nogroup"){ gGuestEnd("This link is not a group link."); }
  else if(msg.t === "chat" || msg.t === "react"){ onNet(msg, null); }
}
function gGuestEnd(msg){
  clearTimeout(ringTimeout); clearTimeout(gRetry); clearTimeout(gAgain);
  gCancelled = true; ring(false); gEnd();
  if(peer){ try{ peer.destroy(); }catch(e){} peer = null; }
  setSub(msg); show("vGuest");
  $("btnCall").classList.remove("hide"); $("btnCall").disabled = false; setLabel($("btnCall"), "Join again");
  $("btnCancel").classList.add("hide"); $("gName").classList.remove("hide");
}
function guestGroupSetup(roomId){
  $("title").textContent = "Group call with " + HOST_NAME;
  setSub("Enter your name and tap Join (up to " + GMAX + " people)");
  show("vGuest");
  $("gName").classList.remove("hide"); $("gName").value = localStorage.getItem("tws_name") || "";
  setLabel($("btnCall"), "Join call");

  $("btnCancel").onclick = () => gGuestEnd("Cancelled.");
  $("btnCall").onclick = async () => {
    G.myName = ($("gName").value || "Guest").trim().slice(0, 20) || "Guest";
    try{ localStorage.setItem("tws_name", G.myName); }catch(e){}
    G.local = await getMic();
    if(!G.local) return;
    await iceReady;
    gCancelled = false; G.isHost = false;
    setSub("Joining…"); ring(true);
    const topic = new URLSearchParams(location.search).get("n");
    notifyHost(topic);
    gAgain = setTimeout(() => { if(!gCancelled && !G.live) notifyHost(topic); }, 20000);
    $("btnCall").classList.add("hide"); $("gName").classList.add("hide"); $("btnCancel").classList.remove("hide");

    peer = newPeer(); remoteId = roomId;
    peer.on("call", c => { const k = c.metadata && c.metadata.kind; if(k === "group" || k === "gvideo") gHandleCall(c); else c.close(); });
    const dial = () => {
      if(gCancelled || !peer || peer.destroyed) return;
      const dc = peer.connect(roomId, { reliable:true });
      G.hostDc = dc;
      dc.on("open", () => { try{ dc.send({ t:"hello", name:G.myName }); }catch(e){} });
      dc.on("data", gGuestMsg);
    };
    peer.on("open", dial);
    ringTimeout = setTimeout(() => { if(!G.live) gGuestEnd(HOST_NAME + " didn't answer. Please try again later."); }, RING_TIMEOUT_MS);
    peer.on("error", e => {
      if(G.live) return;
      if(e.type === "peer-unavailable" && !gCancelled){
        setSub("Waiting for " + HOST_NAME + " to come online…");
        gRetry = setTimeout(dial, 3000); return;
      }
      gGuestEnd("Connection problem. Please try again.");
    });
  };
}

/* ================= CHAT, REACTIONS (live only, gone when the call ends) ================= */
const CH = { dc:null, unread:0, open:false };
const EMOJIS = ["😀","😂","😍","🥰","😎","🤔","😢","😮","😡","👍","👎","👏","🙏","🙌","💪","🔥","❤️","🎉","✅","❌","👋","🤝","✨","💯"];
const REACTS = ["👍","❤️","😂","👏","🙏","😮","✋"];

function chatTargets(){
  if(G.live) return G.isHost ? G.members.filter(m => m.live && m.dc.open).map(m => m.dc) : (G.hostDc && G.hostDc.open ? [G.hostDc] : []);
  return (CH.dc && CH.dc.open) ? [CH.dc] : [];
}
function netSend(obj, except){ chatTargets().forEach(dc => { if(dc !== except){ try{ dc.send(obj); }catch(e){} } }); }
function myChatName(){ return G.live ? G.myName : (room ? "" : HOST_NAME); }
function isGroupCall(){ return G.live; }

function chatEmpty(){ if(!$("chatList").children.length){ const d = document.createElement("div"); d.className = "empty"; d.textContent = "Messages here disappear when the call ends."; $("chatList").appendChild(d); } }
function addBubble(from, text, mine){
  const list = $("chatList"); const e = list.querySelector(".empty"); if(e) e.remove();
  const d = document.createElement("div"); d.className = "msg" + (mine ? " me" : "");
  if(!mine && from && isGroupCall()){ const sm = document.createElement("small"); sm.textContent = from; d.appendChild(sm); }
  d.appendChild(document.createTextNode(text));
  list.appendChild(d); list.scrollTop = list.scrollHeight;
}
function setBadges(){
  ["btnChat","gChat"].forEach(id => { const b = $(id).querySelector(".badge"); b.textContent = CH.unread > 9 ? "9+" : CH.unread; b.classList.toggle("hide", !CH.unread); });
}
function openChat(){
  CH.open = true; CH.unread = 0; setBadges();
  $("reactBar").classList.add("hide"); $("chat").classList.remove("hide"); chatEmpty();
  setTimeout(() => $("chatList").scrollTop = $("chatList").scrollHeight, 0);
}
function closeChat(){ CH.open = false; $("chat").classList.add("hide"); $("emojiGrid").classList.add("hide"); }
function clearChat(){
  closeChat(); $("chatList").innerHTML = ""; CH.unread = 0; CH.dc = null; setBadges();
  $("reactBar").classList.add("hide"); $("floats").innerHTML = "";
}
function floatEmoji(emoji, from){
  const f = document.createElement("div"); f.className = "fl";
  f.style.left = (14 + Math.random() * 66) + "%";
  f.textContent = emoji;
  if(from && isGroupCall()){ const sm = document.createElement("small"); sm.textContent = from; f.appendChild(sm); }
  $("floats").appendChild(f); setTimeout(() => f.remove(), 2800);
}
function sendChat(text){
  text = text.trim(); if(!text) return;
  netSend({ t:"chat", from:myChatName(), text });
  addBubble("", text, true);
}
function sendReact(emoji){
  netSend({ t:"react", from:myChatName(), emoji });
  floatEmoji(emoji, "");
  $("reactBar").classList.add("hide");
}
function onNet(msg, fromDc){
  if(!msg) return;
  const relay = G.live && G.isHost;
  if(msg.t === "chat" && typeof msg.text === "string"){
    const text = msg.text.slice(0, 500), from = String(msg.from || "").slice(0, 20);
    addBubble(from, text, false);
    if(!CH.open){ CH.unread++; setBadges(); if(navigator.vibrate) navigator.vibrate(60); }
    if(relay) netSend({ t:"chat", from, text }, fromDc);
  }else if(msg.t === "react" && typeof msg.emoji === "string"){
    const emoji = msg.emoji.slice(0, 4), from = String(msg.from || "").slice(0, 20);
    floatEmoji(emoji, from);
    if(relay) netSend({ t:"react", from, emoji }, fromDc);
  }
}
function openGuestChat(){
  if(CH.dc || !peer || !room) return;
  const dc = peer.connect(room, { reliable:true }); CH.dc = dc;
  dc.on("open", () => { try{ dc.send({ t:"hi1" }); }catch(e){} });
  dc.on("data", m => onNet(m, dc));
  dc.on("close", () => { if(CH.dc === dc) CH.dc = null; });
}
// UI wiring
REACTS.forEach(em => { const b = document.createElement("button"); b.type = "button"; b.textContent = em; b.setAttribute("aria-label", "React " + em); b.onclick = () => sendReact(em); $("reactBar").appendChild(b); });
EMOJIS.forEach(em => { const b = document.createElement("button"); b.type = "button"; b.textContent = em; b.onclick = () => { $("chatInput").value += em; $("chatInput").focus(); }; $("emojiGrid").appendChild(b); });
["btnChat","gChat"].forEach(id => $(id).onclick = () => CH.open ? closeChat() : openChat());
["btnReact","gReact"].forEach(id => $(id).onclick = () => { closeChat(); $("reactBar").classList.toggle("hide"); });
$("chatClose").onclick = closeChat;
$("chatEmoji").onclick = () => $("emojiGrid").classList.toggle("hide");
$("chatForm").onsubmit = e => { e.preventDefault(); sendChat($("chatInput").value); $("chatInput").value = ""; };

/* ---- leave a message (works when Shebi is offline; arrives as an ntfy alert) ---- */
function setupLeaveMessage(){
  const topic = new URLSearchParams(location.search).get("n");
  if(!topic) return;
  $("btnMsgToggle").classList.remove("hide");
  $("btnMsgToggle").onclick = () => $("msgBox").classList.toggle("hide");
  $("msgName").value = localStorage.getItem("tws_name") || "";
  $("btnMsgSend").onclick = async () => {
    const name = ($("msgName").value || "").trim().slice(0, 30) || "Someone", text = ($("msgText").value || "").trim();
    if(!text){ $("msgStatus").textContent = "Write a message first."; return; }
    $("btnMsgSend").disabled = true; $("msgStatus").textContent = "Sending…";
    try{
      const r = await fetch("https://ntfy.sh/", { method:"POST", headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ topic, title:"Message from " + name, message:text, priority:4, tags:["speech_balloon"], click: location.origin + location.pathname }) });
      if(!r.ok) throw new Error("http " + r.status);
      $("msgStatus").textContent = "Message sent. " + HOST_NAME + " will see it on his phone."; $("msgText").value = "";
      try{ localStorage.setItem("tws_name", name); }catch(e){}
    }catch(e){ $("msgStatus").textContent = "Could not send. Check your connection and try again."; }
    $("btnMsgSend").disabled = false;
  };
}

/* ================= HOST (you) ================= */
let linkActive = false, creating = false, incomingActive = false;

function modeText(){
  const m = localStorage.getItem("tws_mode") || "reuse", exp = +localStorage.getItem("tws_exp") || 0;
  if(m === "once") return "One-time link: stops working after one call.";
  if(exp) return "Expires: " + new Date(exp).toLocaleString();
  return "Reusable link: works until you disable it.";
}
function disableLink(msg){
  linkActive = false; creating = false; incomingActive = false;
  if(G.live){ gEnd(); G.isHost = false; }
  G.members = [];
  ["tws_id","tws_mode","tws_exp","tws_type"].forEach(k => localStorage.removeItem(k));
  stopRingtone(); ring(false); clearCallNotification();
  if(peer){ try{ peer.destroy(); }catch(e){} peer = null; }
  setSub(msg || "Link disabled. Create a new one."); show("vCreate");
}
function hostWatchdog(){
  if(!linkActive) return;
  const exp = +localStorage.getItem("tws_exp") || 0;
  if(exp && Date.now() > exp && !call && !incomingActive && !G.live){ disableLink("Link expired. Create a new one."); return; }
  if(peer && peer.disconnected && !peer.destroyed){ try{ peer.reconnect(); }catch(e){} }
  if((!peer || peer.destroyed) && !creating) createLink();
}

function hostSetup(){
  $("title").textContent = "Talk with " + HOST_NAME;
  setSub("Create a link and send it on WhatsApp");
  show("vCreate");
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});

  $("btnCreate").onclick = () => {
    if(ADMIN_PIN){
      const p = prompt("Enter PIN");
      if(p !== ADMIN_PIN) return;
    }
    const mode = $("selMode").value, hours = { "1h":1, "24h":24, "7d":168 }[mode];
    localStorage.setItem("tws_mode", mode === "once" ? "once" : (hours ? "timed" : "reuse"));
    if(hours) localStorage.setItem("tws_exp", String(Date.now() + hours*3600*1000)); else localStorage.removeItem("tws_exp");
    localStorage.setItem("tws_type", $("selType").value);
    localStorage.removeItem("tws_id");                 // always a fresh link
    if(peer){ try{ peer.destroy(); }catch(e){} peer = null; }
    enableAlerts();                                    // user tap: unlock ring sound + ask notification permission
    createLink();
  };
  $("btnDisable").onclick = () => disableLink("Link disabled. Create a new one.");
  $("btnAlerts").onclick = enableAlerts;
  $("btnCopy").onclick = async () => {
    try{ await navigator.clipboard.writeText($("linkBox").textContent); setLabel($("btnCopy"), "Copied"); setTimeout(() => setLabel($("btnCopy"), "Copy link"), 1500);}catch(e){}
  };
  $("btnWA").onclick = () => {
    const msg = "Call me here: " + $("linkBox").textContent;
    window.open("https://wa.me/?text=" + encodeURIComponent(msg), "_blank");
  };

  // resume the saved link after a reload
  if(localStorage.getItem("tws_id")){
    const exp = +localStorage.getItem("tws_exp") || 0;
    if(exp && Date.now() > exp) disableLink("Your last link expired. Create a new one.");
    else createLink();
  }
  setInterval(hostWatchdog, 10000);
  document.addEventListener("visibilitychange", () => { if(!document.hidden) hostWatchdog(); });
}

async function createLink(){
  if(creating) return;
  creating = true; linkActive = true;
  setSub("Creating link…");
  await iceReady;
  const id = localStorage.getItem("tws_id") || randId();
  const topic = localStorage.getItem("tws_topic") || randId().replace("tws-","tws-n-");   // alert topic stays the same for all your links
  localStorage.setItem("tws_id", id); localStorage.setItem("tws_topic", topic);
  const p = newPeer(id); peer = p;

  p.on("open", () => {
    creating = false;
    $("topicBox").textContent = topic;
    const grp = localStorage.getItem("tws_type") === "group";
    $("linkBox").textContent = location.origin + location.pathname + "?r=" + id + "&n=" + topic + (grp ? "&g=1" : "");
    $("modeNote").textContent = (grp ? "Group call, up to " + GMAX + " people. " : "") + modeText();
    $("btnAlerts").classList.toggle("hide", alertsReady);
    if(!call && !incomingActive && !G.live){ setSub("Waiting for a call…"); show("vShare"); }
  });

  p.on("connection", dc => {
    dc.on("data", msg => {
      if(!msg) return;
      if(msg.t === "hello") hostGroupJoin(dc, String(msg.name || "Guest").slice(0, 20));
      else if(msg.t === "hi1"){ CH.dc = dc; }
      else onNet(msg, dc);
    });
    dc.on("close", () => { if(CH.dc === dc) CH.dc = null; hostGroupLeft(dc); });
  });
  p.on("call", incoming => {
    const kind = incoming.metadata && incoming.metadata.kind;
    if(kind === "group" || kind === "gvideo"){ gHandleCall(incoming); return; }
    if(kind === "video"){ acceptVideo(incoming); return; }
    if(call || incomingActive){ incoming.close(); return; }              // already busy
    const exp = +localStorage.getItem("tws_exp") || 0;
    if(exp && Date.now() > exp){ incoming.close(); disableLink("Link expired. Create a new one."); return; }
    remoteId = incoming.peer; incomingActive = true;
    setSub("Incoming call…"); ring(true); startRingtone(); showCallNotification(); show("vIncoming");
    const done = () => { incomingActive = false; stopRingtone(); ring(false); clearCallNotification(); };
    $("btnAnswer").onclick = async () => {
      stopRingtone(); clearCallNotification();
      localStream = await getMic();
      if(!localStream){ incoming.close(); done(); show("vShare"); return; }
      incomingActive = false;
      incoming.answer(localStream, { sdpTransform });
      bindCall(incoming, afterHostCall);
    };
    $("btnDecline").onclick = () => { done(); incoming.close(); setSub("Waiting for a call…"); show("vShare"); };
    incoming.on("close", () => { if(!localStream && incomingActive){ done(); setSub("Missed call"); show("vShare"); } });
  });

  p.on("disconnected", () => { try{ if(!p.destroyed) p.reconnect(); }catch(e){} });
  p.on("error", e => {
    creating = false;
    if(e.type === "unavailable-id"){ setSub("Reconnecting…"); try{ p.destroy(); }catch(x){} return; }   // watchdog retries shortly
    if(["network","server-error","socket-error","socket-closed"].includes(e.type)){ setSub("Network problem, reconnecting…"); return; }
    setSub("Connection problem (" + e.type + ").");
  });
}
function afterHostCall(msg){
  remoteId = null;
  if(localStorage.getItem("tws_mode") === "once"){ disableLink("One-time link used. Create a new link."); return; }
  setSub(msg + ". Waiting for a call…"); show("vShare");
}

/* ================= GUEST ================= */
let gCancelled = false, gRetry = null, gAgain = null;
function notifyHost(topic){
  if(!topic) return;
  try{
    fetch("https://ntfy.sh/" + encodeURIComponent(topic), { method:"POST", body:"Incoming call - tap to open and answer",
      headers:{ "Title":"Talk with Shebi", "Priority":"urgent", "Tags":"phone", "Click": location.origin + location.pathname } });
  }catch(e){}
}
function guestSetup(roomId){
  if(isGroup){ guestGroupSetup(roomId); return; }
  $("title").textContent = "Call " + HOST_NAME;
  setSub("Tap the button to start an audio call");
  show("vGuest");

  $("btnCancel").onclick = () => {
    gCancelled = true; clearTimeout(gRetry);
    if(call){ call.close(); } else cleanupCall(afterGuestCall, "Call cancelled");
  };

  $("btnCall").onclick = async () => {
    localStream = await getMic();
    if(!localStream) return;
    await iceReady;
    gCancelled = false;
    setSub("Calling " + HOST_NAME + "…"); ring(true);
    const topic = new URLSearchParams(location.search).get("n");
    notifyHost(topic);
    gAgain = setTimeout(() => { if(!gCancelled && $("stage").classList.contains("hide")) notifyHost(topic); }, 20000);
    $("btnCall").classList.add("hide"); $("btnCancel").classList.remove("hide");

    peer = newPeer(); remoteId = roomId;
    peer.on("call", inc => { if(inc.metadata && inc.metadata.kind === "video") acceptVideo(inc); else inc.close(); });
    const dial = () => {
      if(gCancelled || !peer || peer.destroyed) return;
      const c = peer.call(roomId, localStream, { sdpTransform });
      bindCall(c, afterGuestCall);
    };
    peer.on("open", dial);
    // keep ringing (and retrying) for up to a minute, so a call made while Shebi's page is closed still connects once he opens it
    ringTimeout = setTimeout(() => {
      gCancelled = true; clearTimeout(gRetry);
      if(call){ call._ignore = true; try{ call.close(); }catch(e){} }
      cleanupCall(afterGuestCall, HOST_NAME + " didn't answer. Please try again later.");
    }, RING_TIMEOUT_MS);
    peer.on("error", e => {
      if(e.type === "peer-unavailable" && !gCancelled){
        setSub("Waiting for " + HOST_NAME + " to come online…");
        if(call){ call._ignore = true; try{ call.close(); }catch(x){} call = null; }
        gRetry = setTimeout(dial, 3000);
        return;
      }
      gCancelled = true; clearTimeout(gRetry);
      cleanupCall(afterGuestCall, "Connection problem. Please try again.");
    });
  };
}
function afterGuestCall(msg){
  clearTimeout(gRetry); clearTimeout(gAgain);
  setSub(msg); show("vGuest");
  $("btnCall").classList.remove("hide"); $("btnCall").disabled = false; setLabel($("btnCall"), "Call again");
  $("btnCancel").classList.add("hide");
  if(peer){ try{ peer.destroy(); }catch(e){} peer = null; }
}

/* ================= INIT ================= */
const room = new URLSearchParams(location.search).get("r");
const isGroup = new URLSearchParams(location.search).get("g") === "1";
if(!navigator.mediaDevices || !window.Peer){ setSub("This browser is not supported or you are offline."); }
else if(room){ guestSetup(room); setupLeaveMessage(); }
else hostSetup();

window.addEventListener("beforeunload", () => { if(peer) try{peer.destroy();}catch(e){} });
</script>
