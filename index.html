<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Talk with Shebi</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --txt:#f1f5f9; --mut:#94a3b8; --ok:#22c55e; --bad:#ef4444; --acc:#38bdf8; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body { background:radial-gradient(circle at 50% 0%, #1e3a5f 0%, var(--bg) 60%); color:var(--txt);
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card { width:100%; max-width:380px; background:var(--card); border-radius:24px; padding:32px 24px; text-align:center;
          box-shadow:0 20px 60px rgba(0,0,0,.45); }
  .avatar { width:96px; height:96px; border-radius:50%; margin:0 auto 18px; display:flex; align-items:center; justify-content:center;
            font-size:40px; font-weight:700; background:linear-gradient(135deg,#0ea5e9,#6366f1); }
  .avatar.ring { animation:pulse 1.4s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(56,189,248,.6)} 100%{box-shadow:0 0 0 28px rgba(56,189,248,0)} }
  h1 { font-size:22px; margin-bottom:6px; }
  .sub { color:var(--mut); font-size:14px; min-height:20px; margin-bottom:22px; }
  button { width:100%; border:0; border-radius:14px; padding:15px; font-size:16px; font-weight:600; cursor:pointer; color:#fff; margin-top:10px; }
  .go { background:var(--ok); } .end { background:var(--bad); } .sec { background:#334155; } .wa { background:#25d366; }
  .row { display:flex; gap:10px; } .row button { margin-top:10px; }
  .link { background:#0f172a; border-radius:12px; padding:12px; font-size:12px; word-break:break-all; color:var(--acc); margin:10px 0 4px; user-select:all; }
  .timer { font-size:34px; font-variant-numeric:tabular-nums; margin:4px 0 18px; }
  .hide { display:none !important; }
  .note { color:var(--mut); font-size:12px; margin-top:16px; }
  .m { display:flex; align-items:center; gap:10px; font-size:13px; color:var(--mut); margin:6px 0; text-align:left; }
  .m span { width:72px; flex:none; }
  .bar { flex:1; height:8px; background:#0f172a; border-radius:6px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--ok); transition:width .1s; }
  #meters { margin-bottom:14px; }
  input.txt { width:100%; padding:14px; border-radius:14px; border:1px solid #334155; background:#0f172a; color:var(--txt); font-size:16px; margin-bottom:10px; }
  #gstage { position:fixed; inset:0; z-index:55; background:radial-gradient(circle at 50% 20%, #12294a 0%, #020617 70%); }
  #gTop { position:absolute; top:max(12px, env(safe-area-inset-top)); left:0; right:0; display:flex; justify-content:center; gap:14px; font-size:15px; text-shadow:0 1px 6px rgba(0,0,0,.7); z-index:2; }
  #gGrid { position:absolute; top:max(48px, calc(env(safe-area-inset-top) + 40px)); bottom:104px; left:8px; right:8px; display:grid; gap:8px; grid-template-columns:1fr; grid-auto-rows:1fr; }
  #gGrid[data-n="3"], #gGrid[data-n="4"] { grid-template-columns:1fr 1fr; }
  @media (orientation:landscape) { #gGrid[data-n="2"] { grid-template-columns:1fr 1fr; } }
  .tile { position:relative; background:#0b1222; border-radius:16px; overflow:hidden; display:flex; align-items:center; justify-content:center; min-height:0; }
  .tile video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:none; background:#000; }
  .tile.hasVid video { display:block; }
  .tile .av { width:72px; height:72px; border-radius:50%; background:linear-gradient(135deg,#0ea5e9,#6366f1); display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:700; }
  .tile.hasVid .av { display:none; }
  .tile .nm { position:absolute; left:10px; bottom:8px; font-size:13px; background:rgba(0,0,0,.5); padding:2px 9px; border-radius:10px; }
  .tile.speaking { box-shadow:inset 0 0 0 3px var(--ok); }
  #gCtrls { position:absolute; bottom:max(26px, env(safe-area-inset-bottom)); left:0; right:0; display:flex; justify-content:center; gap:14px; z-index:2; }
  #gSound { position:absolute; left:20px; right:20px; bottom:110px; width:auto; z-index:3; }
  select { width:100%; padding:14px; border-radius:14px; border:1px solid #334155; background:#0f172a; color:var(--txt); font-size:15px; margin-bottom:6px; }
  #stage { position:fixed; inset:0; z-index:50; background:radial-gradient(circle at 50% 30%, #1e3a5f 0%, #020617 70%); overflow:hidden; }
  #stage video { background:#000; }
  #rvid { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:none; }
  #stage.hasRemote #rvid { display:block; }
  #noVid { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; }
  #noVid .avatar { margin:0; }
  #stName { font-size:22px; font-weight:600; }
  #stage.hasRemote #noVid { display:none; }
  #lvid { position:absolute; right:14px; top:max(64px, calc(env(safe-area-inset-top) + 56px)); width:28vw; max-width:150px; aspect-ratio:3/4; object-fit:cover;
          border-radius:14px; border:2px solid rgba(255,255,255,.35); display:none; box-shadow:0 6px 20px rgba(0,0,0,.5); }
  #stage.hasLocal #lvid { display:block; }
  #topbar { position:absolute; top:max(14px, env(safe-area-inset-top)); left:0; right:0; text-align:center; text-shadow:0 1px 6px rgba(0,0,0,.7); }
  #topbar .timer { font-size:22px; margin:0; }
  #topbar .mini { display:flex; justify-content:center; gap:8px; margin-top:6px; }
  #topbar .mini .bar { width:56px; height:5px; }
  #ctrls { position:absolute; bottom:max(26px, env(safe-area-inset-bottom)); left:0; right:0; display:flex; justify-content:center; gap:14px; }
  .cb { width:60px; height:60px; border-radius:50%; margin:0; padding:0; font-size:22px; background:rgba(51,65,85,.85); backdrop-filter:blur(6px); }
  .cb.off { background:#fff; color:#0f172a; }
  .cb.end { background:var(--bad); }
</style>
</head>
<body>
<div class="card">
  <div id="av" class="avatar">S</div>
  <h1 id="title">Talk with Shebi</h1>
  <div id="sub" class="sub"></div>
  <div id="meters" class="hide">
    <div class="m"><span>🎤 You</span><div class="bar"><i id="mLocal"></i></div></div>
    <div class="m"><span>🔊 Them</span><div class="bar"><i id="mRemote"></i></div></div>
    <div class="note" id="conn" style="margin-top:6px"></div>
    <button class="go hide" id="btnSound">🔊 Tap to enable sound</button>
  </div>

  <!-- HOST: create link -->
  <div id="vCreate" class="hide">
    <select id="selType">
      <option value="one">1-to-1 call</option>
      <option value="group">Group call (up to 4 people)</option>
    </select>
    <select id="selMode">
      <option value="reuse">Reusable link (until I disable it)</option>
      <option value="once">One-time link (dies after one call)</option>
      <option value="1h">Expires in 1 hour</option>
      <option value="24h">Expires in 24 hours</option>
      <option value="7d">Expires in 7 days</option>
    </select>
    <button class="go" id="btnCreate">Create call link</button>
  </div>

  <!-- HOST: waiting with link -->
  <div id="vShare" class="hide">
    <button class="go hide" id="btnAlerts">🔔 Tap once to enable ring sound &amp; alerts</button>
    <div class="link" id="linkBox"></div>
    <div class="note" id="modeNote" style="margin-top:4px"></div>
    <div class="row">
      <button class="sec" id="btnCopy">Copy</button>
      <button class="wa" id="btnWA">WhatsApp</button>
    </div>
    <button class="end" id="btnDisable">Disable link</button>
    <div class="note">Open this page to receive calls. For alerts when this page is closed: install the free <b>ntfy</b> app and subscribe to topic<br><b id="topicBox" style="color:#38bdf8;user-select:all"></b></div>
  </div>

  <!-- GUEST: call button -->
  <div id="vGuest" class="hide">
    <input class="txt hide" id="gName" placeholder="Your name" maxlength="20" autocomplete="name">
    <button class="go" id="btnCall">📞 Call Shebi</button>
    <button class="end hide" id="btnCancel">Cancel call</button>
  </div>

  <!-- HOST: incoming -->
  <div id="vIncoming" class="hide">
    <div class="row">
      <button class="end" id="btnDecline">Decline</button>
      <button class="go" id="btnAnswer">Answer</button>
    </div>
  </div>

</div>
<audio id="remote" autoplay playsinline></audio>
<audio id="ringAudio" loop playsinline></audio>

<div id="gstage" class="hide">
  <div id="gTop"><span id="gTimer">00:00</span><span id="gCount"></span></div>
  <div id="gGrid" data-n="0"></div>
  <button class="go hide" id="gSound">🔊 Tap to enable sound</button>
  <div id="gCtrls">
    <button class="cb" id="gMute" title="Mute">🎤</button>
    <button class="cb" id="gCam" title="Camera">📷</button>
    <button class="cb hide" id="gFlip" title="Flip camera">🔄</button>
    <button class="cb end" id="gEnd" title="Leave call">📞</button>
  </div>
  <div id="gAudio"></div>
</div>

<div id="stage" class="hide">
  <video id="rvid" autoplay playsinline muted></video>
  <div id="noVid"><div class="avatar">S</div><div id="stName"></div></div>
  <video id="lvid" autoplay playsinline muted></video>
  <div id="topbar">
    <div class="timer" id="timer">00:00</div>
    <div class="mini"><div class="bar"><i id="mLocal2"></i></div><div class="bar"><i id="mRemote2"></i></div></div>
  </div>
  <div id="ctrls">
    <button class="cb" id="btnMute" title="Mute">🎤</button>
    <button class="cb" id="btnCam" title="Camera">📷</button>
    <button class="cb hide" id="btnFlip" title="Flip camera">🔄</button>
    <button class="cb" id="btnFs" title="Full screen">⛶</button>
    <button class="cb end" id="btnEnd" title="End call">📞</button>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* ================= CONFIG ================= */
const HOST_NAME = "Shebi";
const ADMIN_PIN = "";            // set e.g. "4821" to require a PIN before creating links ("" = off)
// Paste your own Metered TURN credentials URL here (free account). Example:
// "https://YOURAPPNAME.metered.live/api/v1/turn/credentials?apiKey=YOUR_API_KEY"
const METERED_URL = "";
let ICE_SERVERS = [
  { urls: "stun:stun.l.google.com:19302" },
  { urls: "stun:stun1.l.google.com:19302" },
  // Free public TURN fallback (shared, may be slow). Replace with your own Cloudflare/Metered TURN for best reliability.
  { urls: "turn:openrelay.metered.ca:80",  username: "openrelayproject", credential: "openrelayproject" },
  { urls: "turn:openrelay.metered.ca:443", username: "openrelayproject", credential: "openrelayproject" },
  { urls: "turns:openrelay.metered.ca:443?transport=tcp", username: "openrelayproject", credential: "openrelayproject" }
];
const RING_TIMEOUT_MS = 90000;
async function loadIce(){
  if(!METERED_URL) return;
  try{
    const r = await fetch(METERED_URL); const arr = await r.json();
    if(Array.isArray(arr) && arr.length) ICE_SERVERS = [{ urls:"stun:stun.l.google.com:19302" }, ...arr];
  }catch(e){}
}
const iceReady = loadIce();
/* ========================================== */

const $ = id => document.getElementById(id);
const views = ["vCreate","vShare","vGuest","vIncoming"];
function show(v){ views.forEach(x => $(x).classList.toggle("hide", x !== v)); }
function setSub(t){ $("sub").textContent = t; }
function ring(on){ $("av").classList.toggle("ring", !!on); }

let remoteId = null, camStream = null, vOut = null, vIn = null, facing = "user";
let peer = null, call = null, localStream = null, timerInt = null, wakeLock = null, ringTone = null, ringTimeout = null;

const AUDIO = { audio: { echoCancellation:true, noiseSuppression:true, autoGainControl:true, channelCount:1 }, video:false };

// Raise Opus quality (mono, ~64 kbps, FEC) for clear voice
function sdpTransform(sdp){
  return sdp.replace(/a=fmtp:(\d+) (.*useinbandfec=1.*)/g, (m, pt, rest) =>
    /maxaveragebitrate/.test(rest) ? m : `a=fmtp:${pt} ${rest};maxaveragebitrate=64000;stereo=0;sprop-stereo=0;usedtx=0`);
}

function randId(){
  const a = new Uint8Array(12); crypto.getRandomValues(a);
  return "tws-" + Array.from(a, b => b.toString(36).padStart(2,"0")).join("").slice(0,18);
}

function newPeer(id){
  return new Peer(id, { debug:0, config:{ iceServers: ICE_SERVERS } });
}

/* ---------- ringtone (generated WAV played through an <audio> element) ---------- */
function makeRingUrl(){
  const sr = 16000, n = sr * 2, buf = new ArrayBuffer(44 + n*2), v = new DataView(buf);
  const w = (o, str) => { for(let i=0;i<str.length;i++) v.setUint8(o+i, str.charCodeAt(i)); };
  w(0,"RIFF"); v.setUint32(4,36+n*2,true); w(8,"WAVE"); w(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true);
  v.setUint16(22,1,true); v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  w(36,"data"); v.setUint32(40,n*2,true);
  const bursts = [[0,0.4],[0.55,0.95]];
  for(let i=0;i<n;i++){
    const t = i/sr; let env = 0;
    for(const [a0,a1] of bursts){ if(t>=a0 && t<a1) env = Math.min(1,(t-a0)/0.02,(a1-t)/0.02); }
    const smp = env * 0.5 * (Math.sin(2*Math.PI*440*t) + Math.sin(2*Math.PI*480*t)) / 2;
    v.setInt16(44+i*2, Math.round(smp*32767), true);
  }
  return URL.createObjectURL(new Blob([buf], { type:"audio/wav" }));
}
const ringAudio = $("ringAudio");
try{ ringAudio.src = makeRingUrl(); ringAudio.loop = true; }catch(e){}
let ringVib = null, baseTitle = document.title;
function startRingtone(){
  try{ ringAudio.currentTime = 0; ringAudio.muted = false; ringAudio.volume = 1; const p = ringAudio.play(); if(p && p.catch) p.catch(()=>{}); }catch(e){}
  if(navigator.vibrate) navigator.vibrate([500,300,500]);
  clearInterval(ringVib); ringVib = setInterval(() => { if(navigator.vibrate) navigator.vibrate([500,300,500]); }, 2500);
  document.title = "📞 Incoming call";
}
function stopRingtone(){
  try{ ringAudio.pause(); }catch(e){}
  clearInterval(ringVib); ringVib = null; if(navigator.vibrate) navigator.vibrate(0);
  document.title = baseTitle;
}

/* ---------- alerts: unlock audio + notifications ---------- */
let alertsReady = false;
async function enableAlerts(){
  ensureCtx();
  try{ ringAudio.muted = true; await ringAudio.play(); ringAudio.pause(); ringAudio.currentTime = 0; }catch(e){}
  ringAudio.muted = false;
  try{ if("Notification" in window && Notification.permission === "default") await Notification.requestPermission(); }catch(e){}
  try{ if("serviceWorker" in navigator) await navigator.serviceWorker.register("sw.js"); }catch(e){}
  alertsReady = true; $("btnAlerts").classList.add("hide");
}
async function showCallNotification(){
  try{
    if(!("Notification" in window) || Notification.permission !== "granted") return;
    const opts = { body:"Incoming call - tap to answer", tag:"tws-call", renotify:true, requireInteraction:true, vibrate:[400,200,400,200,400] };
    const reg = "serviceWorker" in navigator ? await navigator.serviceWorker.getRegistration() : null;
    if(reg) await reg.showNotification("Talk with Shebi", opts); else new Notification("Talk with Shebi", opts);
  }catch(e){}
}
async function clearCallNotification(){
  try{ const reg = await navigator.serviceWorker.getRegistration(); if(reg){ (await reg.getNotifications({ tag:"tws-call" })).forEach(n => n.close()); } }catch(e){}
}

/* ---------- call UI helpers ---------- */
function startTimer(){
  const t0 = Date.now();
  clearInterval(timerInt);
  timerInt = setInterval(() => {
    const s = Math.floor((Date.now()-t0)/1000);
    $("timer").textContent = String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
  }, 500);
}
async function keepAwake(){ try{ wakeLock = await navigator.wakeLock.request("screen"); }catch(e){} }

function bindCall(c, onEnd){
  call = c; watchConn(c);
  c.on("stream", stream => {
    if(c._ignore) return;
    clearTimeout(ringTimeout);
    $("remote").srcObject = stream;
    $("remote").volume = 1; $("remote").muted = false;
    $("meters").classList.remove("hide"); meter(stream, $("mRemote")); meter(stream, $("mRemote2")); watchConn(c);
    $("remote").play().catch(() => { $("btnSound").classList.remove("hide"); });
    ring(false); stopRingtone();
    setSub("Connected"); show("none"); $("stage").classList.remove("hide");
    $("stName").textContent = room ? HOST_NAME : "Caller";
    startTimer(); keepAwake();
    $("btnMute").textContent = "🎤"; $("btnMute").classList.remove("off");
  });
  c.on("close", () => { if(!c._ignore) cleanupCall(onEnd, "Call ended"); });
  c.on("error", () => { if(!c._ignore) cleanupCall(onEnd, "Call failed"); });
}

function cleanupCall(onEnd, msg){
  clearTimeout(ringTimeout); clearInterval(timerInt); stopRingtone(); ring(false); clearMeters(); endVideo(); $("stage").classList.add("hide");
  if(localStream){ localStream.getTracks().forEach(t=>t.stop()); localStream=null; }
  $("remote").srcObject = null;
  if(wakeLock){ try{wakeLock.release();}catch(e){} wakeLock=null; }
  call = null;
  onEnd(msg);
}

let actx = null, meterTimers = [];
function ensureCtx(){
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state === "suspended") actx.resume(); }catch(e){}
  return actx;
}
function meter(stream, el){
  try{
    const ctx = ensureCtx(); if(!ctx) return;
    const src = ctx.createMediaStreamSource(stream), an = ctx.createAnalyser(); an.fftSize = 256; src.connect(an);
    const d = new Uint8Array(an.fftSize);
    meterTimers.push(setInterval(() => {
      an.getByteTimeDomainData(d); let m = 0; for(const v of d) m = Math.max(m, Math.abs(v-128));
      el.style.width = Math.min(100, m*2) + "%";
    }, 100));
  }catch(e){}
}
function clearMeters(){ meterTimers.forEach(clearInterval); meterTimers = []; $("meters").classList.add("hide"); $("btnSound").classList.add("hide"); $("mLocal").style.width = $("mRemote").style.width = $("mLocal2").style.width = $("mRemote2").style.width = "0"; $("conn").textContent = ""; }
function watchConn(c){
  try{
    const pc = c.peerConnection, upd = () => { $("conn").textContent = "Network: " + pc.iceConnectionState; };
    pc.addEventListener("iceconnectionstatechange", upd); upd();
  }catch(e){}
}
$("btnSound").onclick = () => { ensureCtx(); $("remote").play().then(() => $("btnSound").classList.add("hide")).catch(()=>{}); };

async function getMic(){
  ensureCtx();
  try{
    const st = await navigator.mediaDevices.getUserMedia(AUDIO);
    $("meters").classList.remove("hide"); meter(st, $("mLocal")); meter(st, $("mLocal2"));
    return st;
  }catch(e){
    const n = e && e.name;
    if(n === "NotAllowedError" || n === "SecurityError") setSub("Microphone is blocked. Tap the lock icon next to the address, allow Microphone, then reload.");
    else if(n === "NotFoundError") setSub("No microphone found on this device.");
    else if(n === "NotReadableError") setSub("Microphone is in use by another app or tab. Close it and try again.");
    else setSub("Could not start microphone (" + n + ").");
    return null;
  }
}

$("btnMute").onclick = () => {
  if(!localStream) return;
  const t = localStream.getAudioTracks()[0]; t.enabled = !t.enabled;
  $("btnMute").textContent = t.enabled ? "🎤" : "🔇"; $("btnMute").classList.toggle("off", !t.enabled);
};
$("btnEnd").onclick = () => { if(call) call.close(); };

/* ================= VIDEO (optional, camera on demand) ================= */
const stage = $("stage");
function acceptVideo(inc){
  if(vIn){ try{ vIn.close(); }catch(e){} }
  vIn = inc;
  inc.answer();                                   // receive only
  inc.on("stream", st => { $("rvid").srcObject = st; $("rvid").play().catch(()=>{}); stage.classList.add("hasRemote"); });
  inc.on("close", () => { if(vIn === inc){ vIn = null; $("rvid").srcObject = null; stage.classList.remove("hasRemote"); } });
  inc.on("error", () => { stage.classList.remove("hasRemote"); });
}
async function startCam(){
  if(!peer || !remoteId || !call) return;
  try{
    camStream = await navigator.mediaDevices.getUserMedia({ audio:false,
      video:{ facingMode:facing, width:{ideal:1280}, height:{ideal:720}, frameRate:{ideal:24, max:30} } });
  }catch(e){
    const n = e && e.name;
    $("stName").textContent = n === "NotAllowedError" ? "Camera is blocked - allow it in site settings" : "Could not start camera";
    camStream = null; return;
  }
  $("lvid").srcObject = camStream;
  $("lvid").style.transform = facing === "user" ? "scaleX(-1)" : "none";
  stage.classList.add("hasLocal");
  $("btnCam").textContent = "🎥"; $("btnCam").classList.add("off"); $("btnFlip").classList.remove("hide");
  vOut = peer.call(remoteId, camStream, { metadata:{ kind:"video" } });
}
function stopCam(){
  if(camStream){ camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  if(vOut){ try{ vOut.close(); }catch(e){} vOut = null; }
  $("lvid").srcObject = null; stage.classList.remove("hasLocal");
  $("btnCam").textContent = "📷"; $("btnCam").classList.remove("off"); $("btnFlip").classList.add("hide");
}
function endVideo(){
  stopCam();
  if(vIn){ try{ vIn.close(); }catch(e){} vIn = null; }
  $("rvid").srcObject = null; stage.classList.remove("hasRemote");
}
$("btnCam").onclick = () => { camStream ? stopCam() : startCam(); };
$("btnFlip").onclick = async () => { facing = facing === "user" ? "environment" : "user"; stopCam(); await startCam(); };
$("btnFs").onclick = () => {
  const d = document;
  if(d.fullscreenElement) d.exitFullscreen(); else if(stage.requestFullscreen) stage.requestFullscreen().catch(()=>{});
};

/* ================= GROUP CALL (mesh, up to 4 people) ================= */
const GMAX = 4;
const G = { live:false, local:null, cam:null, facing:"user", peers:new Map(), members:[], hostDc:null, timers:[], timerInt:null, myName:"You", isHost:false, selfTile:null };

function gInitial(n){ return ((n || "?").trim().charAt(0) || "?").toUpperCase(); }
function gLayout(){ const n = $("gGrid").children.length; $("gGrid").dataset.n = n; $("gCount").textContent = n + "/" + GMAX; }
function gMakeTile(name){
  const t = document.createElement("div"); t.className = "tile";
  t.innerHTML = '<video autoplay playsinline muted></video><div class="av"></div><div class="nm"></div>';
  t.querySelector(".nm").textContent = name; t.querySelector(".av").textContent = gInitial(name);
  $("gGrid").appendChild(t); gLayout(); return t;
}
function gEnsure(id, name){
  let e = G.peers.get(id);
  if(e){
    if(name && e.name !== name){ e.name = name; e.tile.querySelector(".nm").textContent = name; e.tile.querySelector(".av").textContent = gInitial(name); }
    return e;
  }
  e = { id, name: name || "Guest", tile: null, call: null, vin: null, vout: null, audio: null };
  e.tile = gMakeTile(e.name); G.peers.set(id, e); return e;
}
function speakWatch(stream, tile){
  try{
    const ctx = ensureCtx(); if(!ctx) return;
    const src = ctx.createMediaStreamSource(stream), an = ctx.createAnalyser(); an.fftSize = 256; src.connect(an);
    const d = new Uint8Array(an.fftSize);
    G.timers.push(setInterval(() => {
      an.getByteTimeDomainData(d); let m = 0; for(const v of d) m = Math.max(m, Math.abs(v-128));
      tile.classList.toggle("speaking", m > 14);
    }, 150));
  }catch(e){}
}
function gAttachAudio(e, stream){
  if(!e.audio){ e.audio = document.createElement("audio"); e.audio.autoplay = true; e.audio.setAttribute("playsinline",""); $("gAudio").appendChild(e.audio); }
  e.audio.srcObject = stream;
  e.audio.play().catch(() => { $("gSound").classList.remove("hide"); });
  speakWatch(stream, e.tile);
}
$("gSound").onclick = () => { ensureCtx(); G.peers.forEach(e => { if(e.audio) e.audio.play().catch(()=>{}); }); $("gSound").classList.add("hide"); };
function gRemove(id){
  const e = G.peers.get(id); if(!e) return;
  G.peers.delete(id);
  [e.call, e.vin, e.vout].forEach(c => { if(c){ c._ignore = true; try{ c.close(); }catch(x){} } });
  if(e.tile) e.tile.remove();
  if(e.audio) e.audio.remove();
  gLayout();
}
function gSendVideo(e){
  if(!G.cam || !peer) return;
  if(e.vout){ try{ e.vout.close(); }catch(x){} }
  e.vout = peer.call(e.id, G.cam, { metadata:{ kind:"gvideo", name:G.myName } });
}
function gHandleCall(c){
  const kind = c.metadata && c.metadata.kind;
  if(!G.live || !G.local){ try{ c.close(); }catch(x){} return; }
  const id = c.peer;
  if(!G.peers.has(id) && G.peers.size >= GMAX - 1){ try{ c.close(); }catch(x){} return; }
  const e = gEnsure(id, c.metadata && c.metadata.name);
  if(kind === "group"){
    c.answer(G.local, { sdpTransform });
    e.call = c;
    c.on("stream", st => gAttachAudio(e, st));
    c.on("close", () => { if(e.call === c && !c._ignore) gRemove(id); });
    c.on("error", () => { if(e.call === c && !c._ignore) gRemove(id); });
    if(G.cam) gSendVideo(e);
  }else if(kind === "gvideo"){
    c.answer();
    e.vin = c;
    const vid = e.tile.querySelector("video");
    c.on("stream", st => { vid.srcObject = st; e.tile.classList.add("hasVid"); vid.play().catch(()=>{}); });
    c.on("close", () => { if(e.vin === c){ e.vin = null; vid.srcObject = null; e.tile.classList.remove("hasVid"); } });
  }else{ try{ c.close(); }catch(x){} }
}
function gCallPeer(id, name){
  const old = G.peers.get(id); if(old && old.call) return;
  const e = gEnsure(id, name);
  const c = peer.call(id, G.local, { sdpTransform, metadata:{ kind:"group", name:G.myName } });
  e.call = c;
  c.on("stream", st => gAttachAudio(e, st));
  c.on("close", () => { if(e.call === c && !c._ignore) gRemove(id); });
  c.on("error", () => { if(e.call === c && !c._ignore) gRemove(id); });
  if(G.cam) gSendVideo(e);
}
function gStart(){
  G.live = true;
  $("gGrid").innerHTML = ""; G.peers.clear();
  G.selfTile = gMakeTile("You");
  speakWatch(G.local, G.selfTile);
  $("gstage").classList.remove("hide"); show("none");
  const t0 = Date.now(); clearInterval(G.timerInt);
  G.timerInt = setInterval(() => {
    const sec = Math.floor((Date.now()-t0)/1000);
    $("gTimer").textContent = String(Math.floor(sec/60)).padStart(2,"0") + ":" + String(sec%60).padStart(2,"0");
  }, 500);
  $("gMute").textContent = "🎤"; $("gMute").classList.remove("off");
  keepAwake();
}
async function gStartCam(){
  if(!G.live) return;
  try{
    G.cam = await navigator.mediaDevices.getUserMedia({ audio:false, video:{ facingMode:G.facing, width:{ideal:960}, height:{ideal:720}, frameRate:{ideal:20, max:24} } });
  }catch(e){ G.cam = null; return; }
  const v = G.selfTile.querySelector("video");
  v.srcObject = G.cam; v.style.transform = G.facing === "user" ? "scaleX(-1)" : "none"; v.play().catch(()=>{});
  G.selfTile.classList.add("hasVid");
  $("gCam").textContent = "🎥"; $("gCam").classList.add("off"); $("gFlip").classList.remove("hide");
  G.peers.forEach(e => gSendVideo(e));
}
function gStopCam(){
  if(G.cam){ G.cam.getTracks().forEach(t => t.stop()); G.cam = null; }
  G.peers.forEach(e => { if(e.vout){ try{ e.vout.close(); }catch(x){} e.vout = null; } });
  if(G.selfTile){ G.selfTile.classList.remove("hasVid"); G.selfTile.querySelector("video").srcObject = null; }
  $("gCam").textContent = "📷"; $("gCam").classList.remove("off"); $("gFlip").classList.add("hide");
}
function gEnd(){
  G.live = false;
  clearInterval(G.timerInt); G.timers.forEach(clearInterval); G.timers = [];
  Array.from(G.peers.keys()).forEach(gRemove);
  gStopCam();
  if(G.local){ G.local.getTracks().forEach(t => t.stop()); G.local = null; }
  G.members.forEach(m => { try{ m.dc.close(); }catch(x){} }); G.members = [];
  if(G.hostDc){ try{ G.hostDc.close(); }catch(x){} G.hostDc = null; }
  $("gGrid").innerHTML = ""; gLayout(); $("gstage").classList.add("hide");
  if(wakeLock){ try{ wakeLock.release(); }catch(x){} wakeLock = null; }
  clearMeters();
}
$("gMute").onclick = () => {
  if(!G.local) return;
  const t = G.local.getAudioTracks()[0]; t.enabled = !t.enabled;
  $("gMute").textContent = t.enabled ? "🎤" : "🔇"; $("gMute").classList.toggle("off", !t.enabled);
};
$("gCam").onclick = () => { G.cam ? gStopCam() : gStartCam(); };
$("gFlip").onclick = async () => { G.facing = G.facing === "user" ? "environment" : "user"; gStopCam(); await gStartCam(); };
$("gEnd").onclick = () => { if(G.isHost) hostGroupEnd("Group call ended"); else gGuestEnd("You left the call."); };

/* ---- host side of the group ---- */
function hostRingDone(){ incomingActive = false; stopRingtone(); ring(false); clearCallNotification(); }
function hostAdmit(m){
  const before = [{ id: peer.id, name: HOST_NAME }].concat(G.members.filter(x => x.live).map(x => ({ id:x.id, name:x.name })));
  m.live = true;
  try{ m.dc.send({ t:"go", peers:before }); }catch(e){}
  G.members.filter(x => x.live && x !== m).forEach(x => { try{ x.dc.send({ t:"joined", id:m.id, name:m.name }); }catch(e){} });
}
function hostGroupJoin(dc, name){
  const send = o => { try{ dc.send(o); }catch(e){} };
  if(localStorage.getItem("tws_type") !== "group"){ send({ t:"nogroup" }); return; }
  const exp = +localStorage.getItem("tws_exp") || 0;
  if(exp && Date.now() > exp){ send({ t:"declined" }); return; }
  if(G.members.some(m => m.dc === dc)) return;
  if(G.members.length >= GMAX - 1){ send({ t:"full" }); setTimeout(() => { try{ dc.close(); }catch(e){} }, 500); return; }
  const m = { id: dc.peer, name, dc, live:false };
  G.members.push(m);
  if(G.live){ hostAdmit(m); return; }
  send({ t:"wait" });
  if(!incomingActive) hostGroupRing();
}
function hostGroupRing(){
  incomingActive = true;
  setSub("Group call…"); ring(true); startRingtone(); showCallNotification(); show("vIncoming");
  $("btnAnswer").onclick = async () => {
    stopRingtone(); clearCallNotification();
    G.local = await getMic();
    if(!G.local){
      G.members.forEach(m => { try{ m.dc.send({ t:"declined" }); }catch(e){} });
      G.members = []; hostRingDone(); show("vShare"); return;
    }
    incomingActive = false; G.isHost = true; G.myName = HOST_NAME;
    gStart();
    G.members.slice().forEach(hostAdmit);
  };
  $("btnDecline").onclick = () => {
    G.members.forEach(m => { try{ m.dc.send({ t:"declined" }); m.dc.close(); }catch(e){} });
    G.members = []; hostRingDone(); setSub("Waiting for a call…"); show("vShare");
  };
}
function hostGroupLeft(dc){
  const i = G.members.findIndex(m => m.dc === dc); if(i < 0) return;
  const m = G.members.splice(i, 1)[0];
  if(G.live){ gRemove(m.id); }
  else if(incomingActive && G.members.length === 0){ hostRingDone(); setSub("Missed call"); show("vShare"); }
}
function hostGroupEnd(msg){
  gEnd(); G.isHost = false;
  afterHostCall(msg);
}

/* ---- guest side of the group ---- */
function gGuestMsg(msg){
  if(!msg) return;
  if(msg.t === "wait"){ setSub("Waiting for " + HOST_NAME + " to answer…"); }
  else if(msg.t === "go"){
    if(G.live) return;
    clearTimeout(ringTimeout); clearTimeout(gRetry); clearTimeout(gAgain); ring(false);
    gStart();
    (msg.peers || []).forEach(p => gCallPeer(p.id, p.name));
  }
  else if(msg.t === "full"){ gGuestEnd("This call is full (maximum " + GMAX + " people)."); }
  else if(msg.t === "declined"){ gGuestEnd(HOST_NAME + " is not available right now."); }
  else if(msg.t === "nogroup"){ gGuestEnd("This link is not a group link."); }
}
function gGuestEnd(msg){
  clearTimeout(ringTimeout); clearTimeout(gRetry); clearTimeout(gAgain);
  gCancelled = true; ring(false); gEnd();
  if(peer){ try{ peer.destroy(); }catch(e){} peer = null; }
  setSub(msg); show("vGuest");
  $("btnCall").classList.remove("hide"); $("btnCall").disabled = false; $("btnCall").textContent = "👥 Join again";
  $("btnCancel").classList.add("hide"); $("gName").classList.remove("hide");
}
function guestGroupSetup(roomId){
  $("title").textContent = "Group call with " + HOST_NAME;
  setSub("Enter your name and tap Join (up to " + GMAX + " people)");
  show("vGuest");
  $("gName").classList.remove("hide"); $("gName").value = localStorage.getItem("tws_name") || "";
  $("btnCall").textContent = "👥 Join call";

  $("btnCancel").onclick = () => gGuestEnd("Cancelled.");
  $("btnCall").onclick = async () => {
    G.myName = ($("gName").value || "Guest").trim().slice(0, 20) || "Guest";
    try{ localStorage.setItem("tws_name", G.myName); }catch(e){}
    G.local = await getMic();
    if(!G.local) return;
    await iceReady;
    gCancelled = false; G.isHost = false;
    setSub("Joining…"); ring(true);
    const topic = new URLSearchParams(location.search).get("n");
    notifyHost(topic);
    gAgain = setTimeout(() => { if(!gCancelled && !G.live) notifyHost(topic); }, 20000);
    $("btnCall").classList.add("hide"); $("gName").classList.add("hide"); $("btnCancel").classList.remove("hide");

    peer = newPeer(); remoteId = roomId;
    peer.on("call", c => { const k = c.metadata && c.metadata.kind; if(k === "group" || k === "gvideo") gHandleCall(c); else c.close(); });
    const dial = () => {
      if(gCancelled || !peer || peer.destroyed) return;
      const dc = peer.connect(roomId, { reliable:true });
      G.hostDc = dc;
      dc.on("open", () => { try{ dc.send({ t:"hello", name:G.myName }); }catch(e){} });
      dc.on("data", gGuestMsg);
    };
    peer.on("open", dial);
    ringTimeout = setTimeout(() => { if(!G.live) gGuestEnd(HOST_NAME + " didn't answer. Please try again later."); }, RING_TIMEOUT_MS);
    peer.on("error", e => {
      if(G.live) return;
      if(e.type === "peer-unavailable" && !gCancelled){
        setSub("Waiting for " + HOST_NAME + " to come online…");
        gRetry = setTimeout(dial, 3000); return;
      }
      gGuestEnd("Connection problem. Please try again.");
    });
  };
}

/* ================= HOST (you) ================= */
let linkActive = false, creating = false, incomingActive = false;

function modeText(){
  const m = localStorage.getItem("tws_mode") || "reuse", exp = +localStorage.getItem("tws_exp") || 0;
  if(m === "once") return "One-time link: stops working after one call.";
  if(exp) return "Expires: " + new Date(exp).toLocaleString();
  return "Reusable link: works until you disable it.";
}
function disableLink(msg){
  linkActive = false; creating = false; incomingActive = false;
  if(G.live){ gEnd(); G.isHost = false; }
  G.members = [];
  ["tws_id","tws_mode","tws_exp","tws_type"].forEach(k => localStorage.removeItem(k));
  stopRingtone(); ring(false); clearCallNotification();
  if(peer){ try{ peer.destroy(); }catch(e){} peer = null; }
  setSub(msg || "Link disabled. Create a new one."); show("vCreate");
}
function hostWatchdog(){
  if(!linkActive) return;
  const exp = +localStorage.getItem("tws_exp") || 0;
  if(exp && Date.now() > exp && !call && !incomingActive && !G.live){ disableLink("Link expired. Create a new one."); return; }
  if(peer && peer.disconnected && !peer.destroyed){ try{ peer.reconnect(); }catch(e){} }
  if((!peer || peer.destroyed) && !creating) createLink();
}

function hostSetup(){
  $("title").textContent = "Talk with " + HOST_NAME;
  setSub("Create a link and send it on WhatsApp");
  show("vCreate");
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});

  $("btnCreate").onclick = () => {
    if(ADMIN_PIN){
      const p = prompt("Enter PIN");
      if(p !== ADMIN_PIN) return;
    }
    const mode = $("selMode").value, hours = { "1h":1, "24h":24, "7d":168 }[mode];
    localStorage.setItem("tws_mode", mode === "once" ? "once" : (hours ? "timed" : "reuse"));
    if(hours) localStorage.setItem("tws_exp", String(Date.now() + hours*3600*1000)); else localStorage.removeItem("tws_exp");
    localStorage.setItem("tws_type", $("selType").value);
    localStorage.removeItem("tws_id");                 // always a fresh link
    if(peer){ try{ peer.destroy(); }catch(e){} peer = null; }
    enableAlerts();                                    // user tap: unlock ring sound + ask notification permission
    createLink();
  };
  $("btnDisable").onclick = () => disableLink("Link disabled. Create a new one.");
  $("btnAlerts").onclick = enableAlerts;
  $("btnCopy").onclick = async () => {
    try{ await navigator.clipboard.writeText($("linkBox").textContent); $("btnCopy").textContent="Copied ✓"; setTimeout(()=>$("btnCopy").textContent="Copy",1500);}catch(e){}
  };
  $("btnWA").onclick = () => {
    const msg = "Call me here: " + $("linkBox").textContent;
    window.open("https://wa.me/?text=" + encodeURIComponent(msg), "_blank");
  };

  // resume the saved link after a reload
  if(localStorage.getItem("tws_id")){
    const exp = +localStorage.getItem("tws_exp") || 0;
    if(exp && Date.now() > exp) disableLink("Your last link expired. Create a new one.");
    else createLink();
  }
  setInterval(hostWatchdog, 10000);
  document.addEventListener("visibilitychange", () => { if(!document.hidden) hostWatchdog(); });
}

async function createLink(){
  if(creating) return;
  creating = true; linkActive = true;
  setSub("Creating link…");
  await iceReady;
  const id = localStorage.getItem("tws_id") || randId();
  const topic = localStorage.getItem("tws_topic") || randId().replace("tws-","tws-n-");   // alert topic stays the same for all your links
  localStorage.setItem("tws_id", id); localStorage.setItem("tws_topic", topic);
  const p = newPeer(id); peer = p;

  p.on("open", () => {
    creating = false;
    $("topicBox").textContent = topic;
    const grp = localStorage.getItem("tws_type") === "group";
    $("linkBox").textContent = location.origin + location.pathname + "?r=" + id + "&n=" + topic + (grp ? "&g=1" : "");
    $("modeNote").textContent = (grp ? "Group call, up to " + GMAX + " people. " : "") + modeText();
    $("btnAlerts").classList.toggle("hide", alertsReady);
    if(!call && !incomingActive && !G.live){ setSub("Waiting for a call…"); show("vShare"); }
  });

  p.on("connection", dc => {
    dc.on("data", msg => { if(msg && msg.t === "hello") hostGroupJoin(dc, String(msg.name || "Guest").slice(0, 20)); });
    dc.on("close", () => hostGroupLeft(dc));
  });
  p.on("call", incoming => {
    const kind = incoming.metadata && incoming.metadata.kind;
    if(kind === "group" || kind === "gvideo"){ gHandleCall(incoming); return; }
    if(kind === "video"){ acceptVideo(incoming); return; }
    if(call || incomingActive){ incoming.close(); return; }              // already busy
    const exp = +localStorage.getItem("tws_exp") || 0;
    if(exp && Date.now() > exp){ incoming.close(); disableLink("Link expired. Create a new one."); return; }
    remoteId = incoming.peer; incomingActive = true;
    setSub("Incoming call…"); ring(true); startRingtone(); showCallNotification(); show("vIncoming");
    const done = () => { incomingActive = false; stopRingtone(); ring(false); clearCallNotification(); };
    $("btnAnswer").onclick = async () => {
      stopRingtone(); clearCallNotification();
      localStream = await getMic();
      if(!localStream){ incoming.close(); done(); show("vShare"); return; }
      incomingActive = false;
      incoming.answer(localStream, { sdpTransform });
      bindCall(incoming, afterHostCall);
    };
    $("btnDecline").onclick = () => { done(); incoming.close(); setSub("Waiting for a call…"); show("vShare"); };
    incoming.on("close", () => { if(!localStream && incomingActive){ done(); setSub("Missed call"); show("vShare"); } });
  });

  p.on("disconnected", () => { try{ if(!p.destroyed) p.reconnect(); }catch(e){} });
  p.on("error", e => {
    creating = false;
    if(e.type === "unavailable-id"){ setSub("Reconnecting…"); try{ p.destroy(); }catch(x){} return; }   // watchdog retries shortly
    if(["network","server-error","socket-error","socket-closed"].includes(e.type)){ setSub("Network problem, reconnecting…"); return; }
    setSub("Connection problem (" + e.type + ").");
  });
}
function afterHostCall(msg){
  remoteId = null;
  if(localStorage.getItem("tws_mode") === "once"){ disableLink("One-time link used. Create a new link."); return; }
  setSub(msg + ". Waiting for a call…"); show("vShare");
}

/* ================= GUEST ================= */
let gCancelled = false, gRetry = null, gAgain = null;
function notifyHost(topic){
  if(!topic) return;
  try{
    fetch("https://ntfy.sh/" + encodeURIComponent(topic), { method:"POST", body:"Incoming call - tap to open and answer",
      headers:{ "Title":"Talk with Shebi", "Priority":"urgent", "Tags":"phone", "Click": location.origin + location.pathname } });
  }catch(e){}
}
function guestSetup(roomId){
  if(isGroup){ guestGroupSetup(roomId); return; }
  $("title").textContent = "Call " + HOST_NAME;
  setSub("Tap the button to start an audio call");
  show("vGuest");

  $("btnCancel").onclick = () => {
    gCancelled = true; clearTimeout(gRetry);
    if(call){ call.close(); } else cleanupCall(afterGuestCall, "Call cancelled");
  };

  $("btnCall").onclick = async () => {
    localStream = await getMic();
    if(!localStream) return;
    await iceReady;
    gCancelled = false;
    setSub("Calling " + HOST_NAME + "…"); ring(true);
    const topic = new URLSearchParams(location.search).get("n");
    notifyHost(topic);
    gAgain = setTimeout(() => { if(!gCancelled && $("stage").classList.contains("hide")) notifyHost(topic); }, 20000);
    $("btnCall").classList.add("hide"); $("btnCancel").classList.remove("hide");

    peer = newPeer(); remoteId = roomId;
    peer.on("call", inc => { if(inc.metadata && inc.metadata.kind === "video") acceptVideo(inc); else inc.close(); });
    const dial = () => {
      if(gCancelled || !peer || peer.destroyed) return;
      const c = peer.call(roomId, localStream, { sdpTransform });
      bindCall(c, afterGuestCall);
    };
    peer.on("open", dial);
    // keep ringing (and retrying) for up to a minute, so a call made while Shebi's page is closed still connects once he opens it
    ringTimeout = setTimeout(() => {
      gCancelled = true; clearTimeout(gRetry);
      if(call){ call._ignore = true; try{ call.close(); }catch(e){} }
      cleanupCall(afterGuestCall, HOST_NAME + " didn't answer. Please try again later.");
    }, RING_TIMEOUT_MS);
    peer.on("error", e => {
      if(e.type === "peer-unavailable" && !gCancelled){
        setSub("Waiting for " + HOST_NAME + " to come online…");
        if(call){ call._ignore = true; try{ call.close(); }catch(x){} call = null; }
        gRetry = setTimeout(dial, 3000);
        return;
      }
      gCancelled = true; clearTimeout(gRetry);
      cleanupCall(afterGuestCall, "Connection problem. Please try again.");
    });
  };
}
function afterGuestCall(msg){
  clearTimeout(gRetry); clearTimeout(gAgain);
  setSub(msg); show("vGuest");
  $("btnCall").classList.remove("hide"); $("btnCall").disabled = false; $("btnCall").textContent = "📞 Call again";
  $("btnCancel").classList.add("hide");
  if(peer){ try{ peer.destroy(); }catch(e){} peer = null; }
}

/* ================= INIT ================= */
const room = new URLSearchParams(location.search).get("r");
const isGroup = new URLSearchParams(location.search).get("g") === "1";
if(!navigator.mediaDevices || !window.Peer){ setSub("This browser is not supported or you are offline."); }
else if(room) guestSetup(room);
else hostSetup();

window.addEventListener("beforeunload", () => { if(peer) try{peer.destroy();}catch(e){} });
</script>
